<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procurement Acciaio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/app.css" rel="stylesheet" />
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-boxes me-2"></i>ACQUISTI <span class="badge bg-danger align-middle" style="font-size:0.55rem; vertical-align:middle;">V1.0</span>
  </div>
  <div id="ditta-switch" class="btn-group btn-group-sm w-100 px-3 mb-2" role="group">
    <button type="button" class="btn btn-outline-light" data-ditta="ditta1">ILF</button>
    <button type="button" class="btn btn-outline-light" data-ditta="ditta2">SRL</button>
  </div>
  <hr class="sidebar-divider" />

  <div class="sidebar-section">Dashboard</div>
  <a class="nav-link" data-route="/" href="#/"><i class="bi bi-speedometer2"></i>Dashboard</a>
  <a id="nav-prezzi" class="nav-link d-none" data-route="/prezzi" href="#/prezzi"><i class="bi bi-graph-up-arrow"></i>Prezzi</a>

  <div class="sidebar-section">Anagrafica</div>
  <a class="nav-link" data-route="/fornitori" href="#/fornitori"><i class="bi bi-building"></i>Fornitori</a>
  <a class="nav-link" data-route="/categorie" href="#/categorie"><i class="bi bi-tags"></i>Categorie Prodotto</a>
  <a class="nav-link" data-route="/prodotti" href="#/prodotti"><i class="bi bi-box-seam"></i>PRODOTTI</a>
  <a class="nav-link" data-route="/conversioni" href="#/conversioni"><i class="bi bi-arrow-left-right"></i>CONVERSIONI PESO</a>
  <a class="nav-link" data-route="/listino" href="#/listino"><i class="bi bi-currency-euro"></i>LISTINO PREZZI</a>

  <a class="nav-link" data-route="/tickets" href="#/tickets"><i class="bi bi-ticket-perforated"></i>Ticket</a>

  <div class="sidebar-section">Documenti</div>
  <a class="nav-link" data-route="/ordini" href="#/ordini"><i class="bi bi-clipboard-check"></i>Ordini</a>
  <a class="nav-link" data-route="/ddt" href="#/ddt"><i class="bi bi-truck"></i>DDT</a>
  <a class="nav-link" data-route="/fatture" href="#/fatture"><i class="bi bi-receipt"></i>Fatture</a>

  <div id="nav-admin" class="d-none">
    <div class="sidebar-section">Sistema</div>
    <a class="nav-link" data-route="/log-attivita" href="#/log-attivita"><i class="bi bi-list-check"></i>Log Attivit&agrave;</a>
  </div>
</nav>

<!-- Main wrapper -->
<div id="main-wrapper">
  <header id="main-header">
    <h5 id="page-title" class="mb-0 fw-semibold"></h5>
    <div id="header-actions"></div>
    <div id="utente-box" class="d-none align-items-center gap-2 ms-3">
      <i class="bi bi-person-circle text-secondary"></i>
      <span id="utente-nome" class="fw-semibold small"></span>
      <span id="utente-ruolo" class="badge text-bg-secondary"></span>
      <button id="btn-logout" class="btn btn-outline-secondary btn-sm" title="Esci">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>
  <main id="main-content">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
  </main>
</div>

<!-- Login (senza password: solo rete locale) -->
<div id="login-overlay" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-body d-flex align-items-center justify-content-center" style="z-index:2000">
  <div class="card shadow" style="width:22rem">
    <div class="card-body p-4 text-center">
      <h5 class="card-title mb-1"><i class="bi bi-boxes me-2"></i>Procurement Acciaio</h5>
      <p class="text-muted small mb-4">Seleziona il tuo utente per entrare</p>
      <div id="login-utenti" class="d-grid gap-2"></div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<!-- Global modal -->
<div class="modal fade" id="main-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        <button type="button" class="btn btn-primary" id="modal-save-btn">
          <i class="bi bi-check-lg me-1"></i>Salva
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <i class="bi bi-exclamation-triangle text-danger fs-1 d-block mb-3"></i>
        <p id="confirm-text" class="mb-0">Eliminare questo elemento?</p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annulla</button>
        <button type="button" class="btn btn-danger btn-sm" id="confirm-ok-btn">Elimina</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
